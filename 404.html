<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Optiface · Homologação</title>
  <style>
    :root {
      --bg: #111318;
      --bg-card: #1b1e26;
      --bg-card-hover: #232733;
      --border: #2c313d;
      --text: #e6e9f0;
      --muted: #8b93a5;
      --primary: #027be3;
      --primary-hover: #1a8cff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .logo .accent { color: var(--primary); }

    .subtitulo {
      margin-top: 4px;
      font-size: 14px;
      color: var(--muted);
    }

    .cabecalho {
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .cabecalho h2 { font-size: 15px; font-weight: 600; }
    .atualizar {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .atualizar:hover { color: var(--text); border-color: var(--muted); }

    .lista { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    .item:hover { background: var(--bg-card-hover); border-color: var(--primary-hover); }
    .item.selecionada { border-color: var(--primary); }
    .item .criterio { display: flex; align-items: center; gap: 8px; min-width: 0; }

    .versao-nome {
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
    }
    .versao-data { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .sel-badge {
      flex-shrink: 0;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }
    .entrar {
      flex-shrink: 0;
      background: var(--primary);
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .entrar:hover { background: var(--primary-hover); }

    .msg {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 13px;
    }
    .msg.erro { background: #3a1d22; border: 1px solid #7a3b45; color: #f2c0c7; }
    .msg.info { background: #16243a; border: 1px solid #2c4a73; color: #bcd0ec; }
    .msg .detalhe { margin-top: 6px; font-family: monospace; font-size: 11px; color: inherit; opacity: .8; word-break: break-word; }

    .vazio { text-align: center; color: var(--muted); padding: 24px 0; font-size: 14px; }

    .rodape {
      margin-top: 20px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">OPTIFACE <span class="accent">· HOMOLOG</span></div>
    <div class="subtitulo" id="subtitulo">Carregando versões disponíveis…</div>

    <div class="cabecalho">
      <h2>Versões para testar</h2>
      <button class="atualizar" id="btnAtualizar">Atualizar</button>
    </div>

    <div class="lista" id="lista"></div>
    <div class="msg info" id="msgInfo"></div>
    <div class="msg erro" id="msgErro" style="display:none;"></div>

    <div class="rodape">Selecione a versão e abra-a. Todas as versões de homolog ficam publicadas.</div>
  </main>

  <script>
    (function () {
      var STORAGE_KEY = 'optiface-versao-selecionada'
      var lista = document.getElementById('lista')

      // Ao abandonar a PWA antiga (build no escopo raiz), limpa registros e
      // caches para que uma versão não interfira nas outras.
      function limparServiceWorkers() {
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) { reg.unregister() })
            })
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) { caches.delete(key) })
            })
          }
        } catch (err) {}
      }

      function formatarData(iso) {
        try {
          var d = new Date(iso)
          if (isNaN(d.getTime())) return iso || ''
          return d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })
        } catch (err) {
          return iso || ''
        }
      }

      function detalharErro(erro) {
        var el = document.getElementById('msgErro')
        el.style.display = 'block'
        el.innerHTML = 'Não foi possível carregar a lista de versões.<div class="detalhe">' + String(erro || '') + '</div>'
      }

      function render(manifesto) {
        var versoes = (manifesto && Array.isArray(manifesto.versoes)) ? manifesto.versoes : []
        var selecionada = ''
        try { selecionada = localStorage.getItem(STORAGE_KEY) || '' } catch (err) {}

        document.getElementById('subtitulo').textContent =
          'Total: ' + versoes.length + ' versão(ões). Escolha uma para testar.'

        if (!versoes.length) {
          lista.innerHTML = '<div class="vazio">Nenhuma versão publicada ainda.</div>'
          return
        }

        var ordenadas = versoes.slice().sort(function (a, b) {
          return String(b.id || '').localeCompare(String(a.id || ''))
        })

        lista.innerHTML = ''
        ordenadas.forEach(function (v) {
          var id = v.id || v.versao || ''
          if (!id) return
          var ativa = id === selecionada

          var div = document.createElement('div')
          div.className = 'item' + (ativa ? ' selecionada' : '')

          var criterio = document.createElement('div')
          criterio.className = 'criterio'

          var info = document.createElement('div')
          info.style.minWidth = '0'
          var nome = document.createElement('div')
          nome.className = 'versao-nome'
          nome.textContent = id
          var data = document.createElement('div')
          data.className = 'versao-data'
          data.textContent = v.dataPublicacao ? formatarData(v.dataPublicacao) : '—'
          info.appendChild(nome)
          info.appendChild(data)
          criterio.appendChild(info)

          if (ativa) {
            var badge = document.createElement('span')
            badge.className = 'sel-badge'
            badge.textContent = 'Última usada'
            criterio.appendChild(badge)
          }

          var btn = document.createElement('button')
          btn.className = 'entrar'
          btn.textContent = 'Entrar'
          btn.addEventListener('click', function (event) {
            event.stopPropagation()
            abrirVersao(id)
          })

          div.appendChild(criterio)
          div.appendChild(btn)
          div.addEventListener('click', function () { abrirVersao(id) })

          lista.appendChild(div)
        })
      }

      function abrirVersao(id) {
        try { localStorage.setItem(STORAGE_KEY, id) } catch (err) {}
        window.location.href = '/' + encodeURIComponent(id) + '/'
      }

      function carregar() {
        document.getElementById('msgErro').style.display = 'none'
        listar(render, detalharErro)
      }

      // Usa um cache-busting para nunca perder a lista atualizada.
      function listar(ok, falha) {
        fetch('./versoes.json' + '?v=' + Date.now(), { cache: 'no-store' })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status + ' ao buscar versoes.json')
            return res.json()
          })
          .then(ok)
          .catch(falha)
      }

      document.getElementById('btnAtualizar').addEventListener('click', carregar)
      window.addEventListener('DOMContentLoaded', carregar)
      limparServiceWorkers()
    })()
  </script>
</body>
</html>
